<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09131a" />
  <title>PT SlotBook</title>
  <style>
    :root{--bg:#f5f8f7;--surface:#fff;--ink:#102126;--muted:#71838a;--border:#dce8e4;--mint:#9ef0ce;--green:#37b77d;--dark:#09131a;--orange:#ffb86b;--shadow:0 10px 30px rgba(16,33,38,.06)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input,select{font:inherit} button{cursor:pointer;border:0} .app{max-width:1100px;margin:auto;padding:26px 22px 50px}.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.brand{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--muted);margin-bottom:7px}.greeting{font-size:29px;line-height:1.1;font-weight:850;letter-spacing:-.8px}.clock{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px}.clock:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint)}.view{display:none}.view.active{display:block}.hero{background:var(--dark);border-radius:26px;color:#f7faf8;padding:23px 25px;min-height:170px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative;margin-bottom:15px}.hero:after{content:"";position:absolute;right:-45px;top:-90px;width:210px;height:210px;border-radius:50%;background:#173943}.hero>*{position:relative;z-index:1}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:900;color:var(--mint);margin-bottom:8px}.hero-date{font-size:14px;font-weight:650;margin-bottom:17px}.hero-number{font-size:30px;font-weight:900;letter-spacing:-1px}.hero-number span{font-size:18px;color:#83a0a0;font-weight:650}.hero-note{font-size:12px;color:#a3b9b5;margin-top:4px}.badge{width:72px;height:72px;border-radius:23px;background:var(--mint);color:var(--dark);display:grid;place-content:center;text-align:center}.badge b{font-size:25px;line-height:26px}.badge small{font-size:10px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:29px}.stat,.card{background:var(--surface);border:1px solid var(--border);border-radius:18px}.stat{padding:14px;min-height:82px}.stat b{font-size:25px;display:block;margin-bottom:5px}.stat span,.hint,.muted{font-size:11px;color:var(--muted);font-weight:650}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 12px}.section-title{font-size:19px;font-weight:850;letter-spacing:-.2px}.section-sub{font-size:12px;color:var(--muted);margin-top:4px}.link{color:#2aa978;background:none;font-size:12px;font-weight:850;padding:4px}.session-list{display:grid;gap:9px}.session{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);border-radius:18px;background:var(--surface);min-height:80px}.time{width:54px;border-right:1px solid var(--border);font-weight:850;font-size:15px}.time small{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-top:3px}.avatar{width:43px;height:43px;border-radius:15px;display:grid;place-content:center;color:var(--dark);font-size:13px;font-weight:950;flex:none}.session-main{min-width:0;flex:1}.session-main b{display:block;font-size:15px;margin-bottom:4px}.session-main span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:23px;height:23px;border:1px solid var(--border);border-radius:50%;accent-color:var(--green);flex:none}.session.done{opacity:.58}.session.done .session-main b{text-decoration:line-through}.actions{display:flex;gap:9px;margin-top:20px}.primary,.secondary,.danger{min-height:47px;border-radius:15px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:850;font-size:13px}.primary{background:var(--mint);color:var(--dark)}.secondary{background:var(--surface);border:1px solid var(--border);color:var(--ink)}.danger{background:#fff1ef;color:#b64d44}.actions>*{flex:1}.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.page-title{font-size:30px;font-weight:900;letter-spacing:-.8px}.search{width:100%;height:48px;border:1px solid var(--border);border-radius:15px;background:var(--surface);padding:0 14px;color:var(--ink);outline:none;margin-bottom:20px}.search:focus,input:focus,select:focus{border-color:#60c99d;box-shadow:0 0 0 3px rgba(96,201,157,.15)}.list-intro{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.client-list{display:grid;gap:10px}.client-card{padding:15px;border:1px solid var(--border);border-radius:19px;background:var(--surface)}.client-top{display:flex;align-items:center;gap:12px}.client-main{min-width:0;flex:1}.client-main b{font-size:16px;display:block;margin-bottom:4px}.client-main span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.client-actions{display:flex;gap:6px;align-items:center}.edit-btn,.delete-btn{border-radius:9px;padding:7px 8px;font-size:10px;font-weight:850}.edit-btn{background:#eaf8f2;color:#27845f}.delete-btn{background:#fff1ef;color:#b64d44}.cancel-btn{border:1px solid #ffd7aa;background:#fff8ef;color:#b36b22;border-radius:9px;padding:7px 8px;font-size:10px;font-weight:850}.cancel-label{font-size:10px;font-weight:900;color:#b64d44;background:#fff1ef;border-radius:8px;padding:7px}.session.cancelled{opacity:.6}.session.cancelled .session-main b{text-decoration:line-through}.schedule-list{display:grid;gap:8px;margin:9px 0}.schedule-row{display:grid;grid-template-columns:1.1fr 1fr 1fr 32px;gap:7px;align-items:center}.schedule-row select,.schedule-row input{height:40px;border:1px solid var(--border);border-radius:11px;padding:0 9px;background:var(--surface);color:var(--ink);outline:none;font-size:12px}.remove-schedule{height:34px;border-radius:10px;background:#fff1ef;color:#b64d44;font-size:18px}.schedule-add{width:100%;justify-content:center;margin:3px 0 6px}.client-schedule{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.client-schedule span{background:#eef9f4;color:#2b7f62;border-radius:8px;padding:5px 7px;font-size:10px;font-weight:800}.week-availability{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.availability-card{border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:13px}.availability-head{display:flex;justify-content:space-between;align-items:center}.availability-head b{font-size:13px}.availability-head span{font-size:10px;color:var(--muted);font-weight:700}.free-times{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.free-times span{font-size:10px;font-weight:800;color:var(--green);background:#eef9f4;border-radius:7px;padding:5px 6px}.free-times .full{color:var(--muted);background:#f2f5f4}@media(max-width:620px){.schedule-row{grid-template-columns:1fr 1fr}.remove-schedule{grid-column:1/-1;width:100%}.week-availability{grid-template-columns:1fr}}.dialog-backdrop{position:fixed;inset:0;background:rgba(4,12,16,.68);display:grid;place-items:center;padding:18px;z-index:10}.dialog{width:min(430px,100%);background:var(--surface);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.dialog h3{margin:0 0 5px;font-size:20px}.dialog p{margin:0 0 17px;color:var(--muted);font-size:12px}.dialog .field{margin-bottom:10px}.dialog-actions{display:flex;gap:8px;margin-top:15px}.dialog-actions>*{flex:1}.meta{display:flex;gap:18px;padding-top:13px;margin-top:14px;border-top:1px solid #edf2f0;color:var(--muted);font-size:11px;font-weight:700;flex-wrap:wrap}.progress-head{display:flex;justify-content:space-between;margin:13px 0 7px;font-size:11px;color:var(--muted);font-weight:700}.progress-head b{color:var(--ink)}.track{height:6px;border-radius:4px;background:var(--border);overflow:hidden}.fill{height:100%;border-radius:4px;background:var(--green)}.empty{border:1px dashed var(--border);border-radius:18px;padding:28px;text-align:center;color:var(--muted);font-size:13px}.form-card{padding:17px;margin-top:16px}.form-title{font-size:17px;font-weight:850;margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:850}.field input,.field select{height:43px;border:1px solid var(--border);border-radius:12px;padding:0 11px;color:var(--ink);background:var(--surface);outline:none}.form-actions{display:flex;gap:8px;margin-top:13px}.day-tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 18px}.day-tab{min-width:57px;height:61px;border:1px solid var(--border);border-radius:16px;background:var(--surface);font-size:12px;font-weight:850;color:var(--ink)}.day-tab small{display:block;color:var(--muted);margin-top:4px}.day-tab.active{background:var(--mint);border-color:var(--mint);color:var(--dark)}.day-tab.active small{color:#2d6e5b}.schedule-summary{background:var(--dark);border-radius:23px;color:#f7faf8;padding:19px;display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.schedule-summary .big{font-size:24px;font-weight:900;margin:6px 0 3px}.schedule-summary .note{font-size:11px;color:#9cb3ae}.circle{width:68px;height:68px;border-radius:50%;background:#173943;display:grid;place-content:center;text-align:center;color:var(--mint);font-weight:900}.circle small{display:block;color:#9cb3ae;font-size:9px}.slot-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.slot{height:38px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:0 11px;color:var(--ink);font-size:12px;font-weight:800}.slot:hover,.day-tab:hover,.primary:hover,.secondary:hover{filter:brightness(.98);transform:translateY(-1px)}.bottom-nav{position:sticky;bottom:12px;margin:30px auto 0;max-width:520px;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;backdrop-filter:blur(14px)}.nav-btn{background:none;color:var(--muted);padding:10px 5px;border-radius:15px;font-size:11px;font-weight:800}.nav-btn.active{background:var(--dark);color:var(--mint)}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--dark);color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:620px){.app{padding:22px 15px 35px}.greeting{font-size:26px}.hero{padding:21px;min-height:165px}.stats{gap:8px}.stat{padding:12px 10px}.stat b{font-size:23px}.stat span{font-size:10px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-title{font-size:28px}.page-head{align-items:center}.actions{gap:8px}.primary,.secondary{padding:0 10px;font-size:12px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div><div class="brand">PT SLOTBOOK</div><div class="greeting" id="greeting">Selamat datang, Coach</div></div><div class="clock" id="clock">--:--</div></header>

    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-clients"></section>
    <section class="view" id="view-schedule"></section>

    <nav class="bottom-nav" aria-label="Navigasi"><button class="nav-btn active" data-tab="dashboard">Ringkasan</button><button class="nav-btn" data-tab="clients">Klien</button><button class="nav-btn" data-tab="schedule">Jadwal</button></nav>
  </main>
  <div class="toast" id="toast"></div>
  <div id="dialog-root"></div>

  <script>
    const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
    const TIMES=['06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];
    const colors=['#9ef0ce','#ffb86b','#a7c7ff','#f7a8c4','#c6b4ff'];
    const demo={clients:[{id:'c1',name:'Raka Pratama',phone:'0812 4567 8901',goal:'Strength & muscle gain',sessionsLeft:8,totalSessions:12,color:colors[0]},{id:'c2',name:'Nadia Putri',phone:'0821 8899 2233',goal:'Fat loss & consistency',sessionsLeft:5,totalSessions:8,color:colors[1]},{id:'c3',name:'Bima Ardi',phone:'0813 7722 1100',goal:'Mobility & posture',sessionsLeft:3,totalSessions:6,color:colors[2]}],sessions:[{id:'s1',clientId:'c1',day:0,start:'07:00',end:'08:00',completed:false},{id:'s2',clientId:'c2',day:0,start:'17:00',end:'18:00',completed:false},{id:'s3',clientId:'c3',day:1,start:'10:00',end:'11:00',completed:false},{id:'s4',clientId:'c1',day:2,start:'07:00',end:'08:00',completed:false},{id:'s5',clientId:'c2',day:3,start:'17:00',end:'18:00',completed:false},{id:'s6',clientId:'c3',day:4,start:'12:00',end:'13:00',completed:false}]};
    let state=loadState(), activeTab='dashboard', selectedDay=todayIndex(), clientQuery='';
    function loadState(){try{const raw=localStorage.getItem('pt-slotbook-single-html');if(raw){const parsed=JSON.parse(raw);if(parsed.clients&&parsed.sessions)return parsed}}catch(e){}return JSON.parse(JSON.stringify(demo))}
    function save(){localStorage.setItem('pt-slotbook-single-html',JSON.stringify(state))}
    function todayIndex(){return (new Date().getDay()+6)%7}
    function client(id){return state.clients.find(c=>c.id===id)}
    function initials(name){return name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
    function esc(value){return String(value??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}
    function dateText(){return new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())} function scheduleLabel(s){return DAYS[s.day]+' · '+s.start} function todayKey(){return new Date().toISOString().slice(0,10)} function isCancelled(s){return Array.isArray(s.cancelledDates)&&s.cancelledDates.includes(todayKey())}
    function scheduleRowHTML(schedule={}){const day=Number.isFinite(schedule.day)?schedule.day:todayIndex(),start=schedule.start||'07:00';return `<div class="schedule-row" data-schedule-row><select name="schedule-day">${DAYS.map((d,i)=>`<option value="${i}" ${day===i?'selected':''}>${d}</option>`).join('')}</select><select name="schedule-time">${TIMES.map(t=>`<option ${start===t?'selected':''}>${t}</option>`).join('')}</select><button type="button" class="remove-schedule" data-remove-schedule>×</button></div>`}
    function scheduleRowsHTML(list){return (list&&list.length?list:[{}]).map(scheduleRowHTML).join('')}
    function readScheduleRows(container){return [...container.querySelectorAll('[data-schedule-row]')].map(row=>({day:Number(row.querySelector('[name="schedule-day"]').value),start:row.querySelector('[name="schedule-time"]').value})).filter(s=>s.start)}
    function bindScheduleRows(container){if(!container||container.dataset.bound)return;container.dataset.bound='1';const add=container.parentElement?.querySelector('[data-add-schedule]');add?.addEventListener('click',()=>container.insertAdjacentHTML('beforeend',scheduleRowHTML()));container.addEventListener('click',e=>{const remove=e.target.closest('[data-remove-schedule]');if(remove){const rows=container.querySelectorAll('[data-schedule-row]');if(rows.length>1)remove.closest('[data-schedule-row]').remove();else toast('Minimal satu jadwal harus ada')}})}
 function defaultDate(){return new Date().toISOString().slice(0,10)} function displayDate(date){if(!date)return '';return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric'}).format(new Date(date+'T00:00:00'))} function endTime(start){const h=(Number(start.slice(0,2))+1)%24;return String(h).padStart(2,'0')+':'+start.slice(3)}
    function openSlots(day){const used=new Set(state.sessions.filter(s=>s.day===day&&!((day===todayIndex())&&isCancelled(s))).map(s=>s.start));return TIMES.filter(t=>!used.has(t))}
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
    function formatTime(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});document.getElementById('greeting').textContent=(d.getHours()<12?'Selamat pagi':d.getHours()<18?'Selamat siang':'Selamat malam')+', Coach'}
    function sessionHTML(s){const c=client(s.clientId);if(!c)return '';const cancelled=isCancelled(s);return `<div class="session ${s.completed?'done':''} ${cancelled?'cancelled':''}"><div class="time">${esc(s.start)}<small>${esc(s.end)}</small></div><div class="avatar" style="background:${esc(c.color)}">${esc(initials(c.name))}</div><div class="session-main"><b>${esc(c.name)}</b><span>${cancelled?'Tidak latihan hari ini':esc(c.goal)}</span></div>${cancelled?'<span class="cancel-label">CANCEL</span>':`<button class="cancel-btn" data-cancel-session="${esc(s.id)}">Cancel</button>`}<input class="check" type="checkbox" data-session="${esc(s.id)}" ${s.completed?'checked':''} ${cancelled?'disabled':''} aria-label="Tandai sesi selesai"></div>`}
    function renderDashboard(){const day=todayIndex(), todays=state.sessions.filter(s=>s.day===day).sort((a,b)=>a.start.localeCompare(b.start)),active=state.clients.filter(c=>c.sessionsLeft>0).length,free=openSlots(day).length,done=todays.filter(s=>s.completed).length;document.getElementById('view-dashboard').innerHTML=`<div class="hero"><div><div class="eyebrow">JADWAL HARI INI</div><div class="hero-date">${esc(dateText())}</div><div class="hero-number">${todays.length} sesi <span>terjadwal</span></div><div class="hero-note">${free} slot masih bisa diisi hari ini</div></div><div class="badge"><b>${done}</b><small>selesai</small></div></div><div class="stats"><div class="stat"><b>${active}</b><span>Klien aktif</span></div><div class="stat"><b>${state.sessions.length}</b><span>Sesi / minggu</span></div><div class="stat"><b style="color:var(--green)">${free}</b><span>Slot kosong</span></div></div><div class="section-head"><div><div class="section-title">Sesi hari ini</div><div class="section-sub">${DAYS[day]} · centang setelah selesai</div></div><button class="link" data-go="schedule">Lihat jadwal →</button></div><div class="session-list">${todays.length?todays.map(sessionHTML).join(''):'<div class="empty">Belum ada sesi hari ini.</div>'}</div><div class="actions"><button class="primary" data-go="clients">＋ Tambah klien</button><button class="secondary" data-share>↗ Bagikan slot</button></div>`;bindCommon()}
    function renderClients(){const filtered=state.clients.filter(c=>(c.name+' '+c.goal).toLowerCase().includes(clientQuery.toLowerCase()));document.getElementById('view-clients').innerHTML=`<div class="page-head"><div><div class="eyebrow" style="color:var(--muted)">DATABASE PERSONAL</div><div class="page-title">Klien kamu</div></div><button class="primary" data-toggle-form>＋ Tambah</button></div><input class="search" id="client-search" value="${esc(clientQuery)}" placeholder="Cari nama atau goal..." /><div class="list-intro"><b>${state.clients.length} klien terdaftar</b><span class="hint">Jadwal bisa 1–7 hari per minggu</span></div><div class="client-list">${filtered.length?filtered.map(clientCardHTML).join(''):'<div class="empty">Belum menemukan klien.<br>Coba kata kunci lain.</div>'}</div><div class="card form-card" id="client-form" hidden><div class="form-title">Tambah klien baru</div><form id="add-client-form"><div class="form-grid"><div class="field"><label>Nama lengkap</label><input name="name" required placeholder="Contoh: Sinta Maheswari" /></div><div class="field"><label>WhatsApp (opsional)</label><input name="phone" placeholder="08xx xxxx xxxx" /></div><div class="field full"><label>Goal utama</label><input name="goal" required placeholder="Contoh: Fat loss & stamina" /></div><div class="field full"><label>Jadwal latihan mingguan</label><div class="schedule-list" id="add-schedule-list">${scheduleRowsHTML()}</div><button type="button" class="secondary schedule-add" data-add-schedule>＋ Tambah hari dan jam</button></div><div class="field"><label>Total sesi paket</label><input name="total" type="number" min="1" value="8" required /></div></div><div class="form-actions"><button class="primary" type="submit">Simpan klien</button><button class="secondary" type="button" data-toggle-form>Batal</button></div></form></div>`;const search=document.getElementById('client-search');search.addEventListener('input',e=>{clientQuery=e.target.value;renderClients()});document.querySelectorAll('[data-toggle-form]').forEach(b=>b.addEventListener('click',()=>{const f=document.getElementById('client-form');f.hidden=!f.hidden;if(!f.hidden)f.querySelector('input').focus()}));bindScheduleRows(document.getElementById('add-schedule-list'));document.getElementById('add-client-form').addEventListener('submit',addClient);bindCommon()}

    function clientCardHTML(c){const schedules=state.sessions.filter(s=>s.clientId===c.id).sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start)),used=c.totalSessions-c.sessionsLeft,progress=Math.round(used/c.totalSessions*100);return `<div class="client-card"><div class="client-top"><div class="avatar" style="background:${esc(c.color)}">${esc(initials(c.name))}</div><div class="client-main"><b>${esc(c.name)}</b><span>${esc(c.goal)}</span></div><div class="client-actions"><button class="edit-btn" data-edit="${esc(c.id)}">Edit</button><button class="delete-btn" data-remove="${esc(c.id)}">Hapus</button></div></div><div class="client-schedule">${schedules.length?schedules.map(s=>`<span>◷ ${esc(scheduleLabel(s))}</span>`).join(''):'<span>Belum ada jadwal</span>'}</div><div class="meta"><span>▣ ${schedules.length}x / minggu</span><span>⌕ ${esc(c.phone||'Belum ada nomor')}</span></div><div class="progress-head"><span>Sesi berjalan</span><b>${c.sessionsLeft} <span class="muted">/ ${c.totalSessions} tersisa</span></b></div><div class="track"><div class="fill" style="width:${Math.max(5,progress)}%;background:${c.sessionsLeft<=2?'var(--orange)':'var(--green)'}"></div></div></div>`}

    function renderSchedule(){const daySessions=state.sessions.filter(s=>s.day===selectedDay).sort((a,b)=>a.start.localeCompare(b.start)),free=openSlots(selectedDay),used=daySessions.length,percent=Math.round(used/TIMES.length*100),weekAvailability=DAYS.map((day,i)=>`<div class="availability-card"><div class="availability-head"><b>${day}</b><span>${state.sessions.filter(s=>s.day===i).length} terisi</span></div><div class="free-times">${openSlots(i).length?openSlots(i).map(t=>`<span>${t}–${endTime(t)}</span>`).join(''):'<span class="full">Penuh</span>'}</div></div>`).join('');document.getElementById('view-schedule').innerHTML=`<div class="page-head"><div><div class="eyebrow" style="color:var(--muted)">WEEKLY PLANNER</div><div class="page-title">Jadwal latihan</div></div><button class="primary" data-share>↗ Bagikan</button></div><p class="section-sub" style="margin:-9px 0 18px">Satu klien bisa punya jadwal berbeda di setiap hari.</p><div class="day-tabs">${DAYS.map((d,i)=>`<button class="day-tab ${i===selectedDay?'active':''}" data-day="${i}">${d.slice(0,3)}<small>${state.sessions.filter(s=>s.day===i).length}</small></button>`).join('')}</div><div class="schedule-summary"><div><div class="eyebrow">${DAYS[selectedDay].toUpperCase()}</div><div class="big">${used} jam terisi</div><div class="note">${free.length} slot kosong · jam operasional 06:00–21:00</div></div><div class="circle">${percent}%<small>terpakai</small></div></div><div class="section-head"><div><div class="section-title">${DAYS[selectedDay]}</div><div class="section-sub">${daySessions.length?'Klien yang latihan hari ini':'Belum ada sesi di hari ini'}</div></div><button class="primary" data-add-session>＋ Tambah jam</button></div><div class="session-list">${daySessions.length?daySessions.map(sessionHTML).join(''):'<div class="empty">Hari masih kosong.<br>Tambahkan sesi dari slot kosong.</div>'}</div><div class="section-head" style="margin-top:25px"><div><div class="section-title">Slot kosong semua hari</div><div class="section-sub">Rentang 06:00–21:00 · setiap slot berdurasi 1 jam</div></div></div><div class="week-availability">${weekAvailability}</div><div class="card form-card" id="session-form" hidden><div class="form-title">Tambah jadwal · ${DAYS[selectedDay]}</div><form id="add-session-form"><div class="form-grid"><div class="field"><label>Klien</label><select name="client" required>${state.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Jam mulai</label><select name="time" required>${free.map(t=>`<option>${t}</option>`).join('')}</select></div></div><div class="form-actions"><button class="primary" type="submit">Simpan jadwal</button><button class="secondary" type="button" data-close-session>Batal</button></div></form></div>`;document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{selectedDay=Number(b.dataset.day);renderSchedule()}));document.querySelectorAll('[data-add-session]').forEach(b=>b.addEventListener('click',()=>openSessionForm(b.dataset.time||'')));document.querySelector('[data-close-session]')?.addEventListener('click',()=>document.getElementById('session-form').hidden=true);document.getElementById('add-session-form')?.addEventListener('submit',addSession);bindCommon()}

    function addSession(e){e.preventDefault();const fd=new FormData(e.target),start=String(fd.get('time')),id='s'+Date.now();if(state.sessions.some(s=>s.day===selectedDay&&!isCancelled(s)&&s.start===start)){toast('Jam tersebut sudah terisi');return}state.sessions.push({id,clientId:String(fd.get('client')),day:selectedDay,start,end:endTime(start),completed:false,cancelledDates:[]});save();toast('Jadwal berhasil ditambahkan');renderSchedule()}
    function openSessionForm(time){if(!state.clients.length){toast('Tambahkan klien terlebih dahulu');activeTab='clients';render();return}const f=document.getElementById('session-form');f.hidden=false;if(time)f.querySelector('[name="time"]').value=time;f.scrollIntoView({behavior:'smooth',block:'center'})}
    function addClient(e){e.preventDefault();const fd=new FormData(e.target),total=Math.max(1,Number(fd.get('total'))||8),id='c'+Date.now(),schedules=readScheduleRows(document.getElementById('add-schedule-list'));if(!schedules.length){toast('Tambahkan minimal satu jadwal');return}if(new Set(schedules.map(s=>s.day+'-'+s.start)).size!==schedules.length){toast('Hari dan jam dalam jadwal tidak boleh duplikat');return}if(schedules.some(s=>state.sessions.some(x=>x.day===s.day&&x.start===s.start))){toast('Ada jadwal yang bentrok dengan klien lain');return}state.clients.push({id,name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).trim(),goal:String(fd.get('goal')).trim(),sessionsLeft:total,totalSessions:total,color:colors[state.clients.length%colors.length]});schedules.forEach((s,i)=>state.sessions.push({id:'s'+Date.now()+i,clientId:id,...s,end:endTime(s.start),completed:false}));save();toast('Klien dan jadwal berhasil ditambahkan');renderClients()}

    function closeDialog(){document.getElementById('dialog-root').innerHTML=''}
    function showEdit(id){const c=client(id);if(!c)return;const schedules=state.sessions.filter(s=>s.clientId===id),root=document.getElementById('dialog-root');root.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><h3>Edit klien</h3><p>Atur beberapa hari dan jam latihan sekaligus.</p><form id="edit-client-form"><div class="field"><label>Nama lengkap</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Goal utama</label><input name="goal" required value="${esc(c.goal)}"></div><div class="field"><label>Nomor WhatsApp</label><input name="phone" value="${esc(c.phone||'')}"></div><div class="field"><label>Jadwal latihan mingguan</label><div class="schedule-list" id="edit-schedule-list">${scheduleRowsHTML(schedules)}</div><button type="button" class="secondary schedule-add" data-add-schedule>＋ Tambah hari dan jam</button></div><div class="dialog-actions"><button type="button" class="secondary" data-dialog-cancel>Batal</button><button class="primary" type="submit">Simpan perubahan</button></div></form></div></div>`;root.querySelector('[data-dialog-cancel]').addEventListener('click',closeDialog);bindScheduleRows(root.querySelector('#edit-schedule-list'));root.querySelector('#edit-client-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),nextSchedules=readScheduleRows(root.querySelector('#edit-schedule-list'));if(!nextSchedules.length){toast('Tambahkan minimal satu jadwal');return}if(new Set(nextSchedules.map(s=>s.day+'-'+s.start)).size!==nextSchedules.length){toast('Hari dan jam tidak boleh duplikat');return}if(nextSchedules.some(ns=>state.sessions.some(os=>os.clientId!==id&&os.day===ns.day&&os.start===ns.start))){toast('Ada jadwal yang bentrok dengan klien lain');return}c.name=String(fd.get('name')).trim();c.goal=String(fd.get('goal')).trim();c.phone=String(fd.get('phone')).trim();state.sessions=state.sessions.filter(s=>s.clientId!==id);nextSchedules.forEach((s,i)=>state.sessions.push({id:'s'+Date.now()+i,clientId:id,...s,end:endTime(s.start),completed:false}));save();closeDialog();toast('Data dan jadwal klien diperbarui');renderClients()});root.querySelector('input').focus()}
    function showDelete(id){const c=client(id);if(!c)return;const root=document.getElementById('dialog-root');root.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><h3>Hapus klien?</h3><p>Data ${esc(c.name)} dan seluruh jadwal rutinnya akan dihapus.</p><div class="dialog-actions"><button class="secondary" data-dialog-cancel>Batal</button><button class="danger" data-dialog-delete>Hapus klien</button></div></div></div>`;root.querySelector('[data-dialog-cancel]').addEventListener('click',closeDialog);root.querySelector('[data-dialog-delete]').addEventListener('click',()=>{state.clients=state.clients.filter(x=>x.id!==id);state.sessions=state.sessions.filter(s=>s.clientId!==id);save();closeDialog();toast('Klien dihapus');renderClients()})}
    function removeClient(id){showDelete(id)}
    function editClient(id){showEdit(id)}
    function toggleSession(id,checked){const s=state.sessions.find(x=>x.id===id);if(!s||isCancelled(s))return;const c=client(s.clientId);if(!c)return;if(s.completed===checked)return;s.completed=checked;c.sessionsLeft=Math.max(0,Math.min(c.totalSessions,c.sessionsLeft+(checked?-1:1)));save();toast(checked?'Sesi ditandai selesai':'Checklist sesi dibatalkan');render()} function toggleCancel(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;s.cancelledDates=Array.isArray(s.cancelledDates)?s.cancelledDates:[];const key=todayKey();const index=s.cancelledDates.indexOf(key);if(index>=0)s.cancelledDates.splice(index,1);else{if(s.completed){toast('Batalkan checklist selesai dulu sebelum Cancel');return}s.cancelledDates.push(key)}save();toast(index>=0?'Sesi aktif kembali':'Sesi di-cancel hari ini');render()}
    function share(){const lines=DAYS.map((d,i)=>d+': '+(openSlots(i).length?openSlots(i).join(', '):'Penuh'));const text='Slot latihan tersedia minggu ini\n\n'+lines.join('\n')+'\n\nHubungi saya untuk booking jam latihan.';if(navigator.share)navigator.share({title:'Slot latihan tersedia',text}).catch(()=>{});else if(navigator.clipboard){navigator.clipboard.writeText(text);toast('Ketersediaan slot disalin')}else prompt('Salin teks ini:',text)}
    function bindCommon(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.go;render()}));document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',share));document.querySelectorAll('[data-session]').forEach(b=>b.addEventListener('change',e=>toggleSession(e.target.dataset.session,e.target.checked)));document.querySelectorAll('[data-cancel-session]').forEach(b=>b.addEventListener('click',()=>toggleCancel(b.dataset.cancelSession)));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>removeClient(b.dataset.remove)));document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editClient(b.dataset.edit)))}
    function render(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+activeTab).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));if(activeTab==='dashboard')renderDashboard();if(activeTab==='clients')renderClients();if(activeTab==='schedule')renderSchedule()}
    document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;render()}));formatTime();setInterval(formatTime,30000);render();
  </script>
</body>
</html>
