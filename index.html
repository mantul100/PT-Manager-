  <script>
    const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
    const TIMES=['06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];
    const colors=['#9ef0ce','#ffb86b','#a7c7ff','#f7a8c4','#c6b4ff'];
    const SHEETS_API="https://script.google.com/macros/s/AKfycbzhXgpjf53TeAeQAZij62XCshui6l6chUGd8Sl_Y0TyJA7RD-nTb35W14Tume_0Q3hePQ/exec";
    const demo={clients:[{id:'c1',name:'Raka Pratama',phone:'0812 4567 8901',goal:'Strength & muscle gain',sessionsLeft:8,totalSessions:12,color:colors[0]},{id:'c2',name:'Nadia Putri',phone:'0821 8899 2233',goal:'Fat loss & consistency',sessionsLeft:5,totalSessions:8,color:colors[1]},{id:'c3',name:'Bima Ardi',phone:'0813 7722 1100',goal:'Mobility & posture',sessionsLeft:3,totalSessions:6,color:colors[2]}],sessions:[{id:'s1',clientId:'c1',day:0,start:'07:00',end:'08:00',completed:false},{id:'s2',clientId:'c2',day:0,start:'17:00',end:'18:00',completed:false},{id:'s3',clientId:'c3',day:1,start:'10:00',end:'11:00',completed:false},{id:'s4',clientId:'c1',day:2,start:'07:00',end:'08:00',completed:false},{id:'s5',clientId:'c2',day:3,start:'17:00',end:'18:00',completed:false},{id:'s6',clientId:'c3',day:4,start:'12:00',end:'13:00',completed:false}]};
    let state=loadState(), activeTab='dashboard', selectedDay=todayIndex(), selectedDate=todayKey(), clientQuery='';
    let localRevision=Number(localStorage.getItem('pt-slotbook-local-revision')||0), sheetsSyncing=false;
    function normalizeState(data){data.holidays=Array.isArray(data.holidays)?data.holidays:[];data.availability=data.availability||{weeklyHolidays:[6],weeklyHolidayNames:['Minggu'],blockedTimes:{}};if(!Array.isArray(data.availability.weeklyHolidayNames)){const legacy=Array.isArray(data.availability.weeklyHolidays)?data.availability.weeklyHolidays:[];data.availability.weeklyHolidayNames=(legacy.length===1&&legacy[0]===0)?['Minggu']:legacy.map(i=>DAYS[i]).filter(Boolean)}data.availability.weeklyHolidays=(data.availability.weeklyHolidayNames||[]).map(name=>DAYS.indexOf(name)).filter(i=>i>=0);data.clients=(data.clients||[]).map(c=>({...c,topUpHistory:Array.isArray(c.topUpHistory)?c.topUpHistory:[],startDate:c.startDate||'',expiryDate:c.expiryDate||'',packageQueue:Array.isArray(c.packageQueue)?c.packageQueue:[]}));data.sessions=(data.sessions||[]).map(s=>({...s,completedDates:Array.isArray(s.completedDates)?s.completedDates:(s.completed?[todayKey()]:[]),cancelledDates:Array.isArray(s.cancelledDates)?s.cancelledDates:[],reschedules:Array.isArray(s.reschedules)?s.reschedules:[]}));return data} function loadState(){try{const raw=localStorage.getItem('pt-slotbook-single-html');if(raw){const parsed=JSON.parse(raw);if(parsed.clients&&parsed.sessions)return normalizeState(parsed)}}catch(e){}return normalizeState(JSON.parse(JSON.stringify(demo)))}
    function setSyncStatus(t,k=''){const e=document.getElementById('sync-status');if(e){e.textContent='Sheet: '+t;e.className='sync-status '+k}}
    function save(){localRevision++;localStorage.setItem('pt-slotbook-local-revision',String(localRevision));localStorage.setItem('pt-slotbook-dirty','1');localStorage.setItem('pt-slotbook-single-html',JSON.stringify(state));syncToSheets(localRevision)}
    function syncToSheets(revision=localRevision){if(sheetsSyncing)return;sheetsSyncing=true;setSyncStatus('menyimpan...','busy');fetch(SHEETS_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',state})}).then(()=>{if(revision===localRevision){localStorage.removeItem('pt-slotbook-dirty');setSyncStatus('tersimpan','ok');toast('Sync selesai · data tersimpan')}}).catch(()=>setSyncStatus('offline · lokal aman','offline')).finally(()=>sheetsSyncing=false)}
    async function syncFromSheets(){const revisionAtStart=localRevision;setSyncStatus('memeriksa...','busy');try{const r=await fetch(SHEETS_API,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json();const localChanged=localRevision!==revisionAtStart||localStorage.getItem('pt-slotbook-dirty')==='1';if(localChanged)return;if(p.ok&&p.state&&p.state.clients&&p.state.clients.length){state=normalizeState(p.state);state.sessions=state.sessions.map(s=>({...s,scheduleType:s.scheduleType==='flexible'?'flexible':'routine',date:s.date||''}));localStorage.setItem('pt-slotbook-single-html',JSON.stringify(state));render();setSyncStatus('tersambung','ok');toast('Data dimuat dari Google Sheets')}}catch(e){setSyncStatus('offline · lokal aman','offline')}}
    function timeLabel(value){const text=String(value||'');if(text.includes('T'))return text.slice(11,16);if(text.startsWith('1899')||text.startsWith('1898'))return text.slice(11,16);return text.slice(0,5)} function todayIndex(){return (new Date().getDay()+6)%7} function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`} function isFlexible(s){return s.scheduleType==='flexible'} function isForDate(s){return !isFlexible(s)||s.date===todayKey()} function effectiveStart(s){return s.overrideDate===todayKey()&&s.overrideStart?s.overrideStart:s.start} function effectiveEnd(s){return s.overrideDate===todayKey()&&s.overrideEnd?s.overrideEnd:s.end} function isForDate(s){return !isFlexible(s)||s.date===todayKey()} function sessionMatchesDay(s,d){return s.day===d&&isForDate(s)} function dayNameForDate(date){const d=new Date(date+'T00:00:00Z');return DAYS[(d.getUTCDay()+6)%7]} function isHoliday(date){return (Array.isArray(state.holidays)&&state.holidays.includes(date))||(state.availability?.weeklyHolidayNames||[]).includes(dayNameForDate(date))} function isBlockedTime(date,time){const day=(new Date(date+'T00:00:00').getDay()+6)%7;const start=(String(time).match(/^(\d{1,2}):(\d{2})$/)||[]);if(!start.length)return false;const mins=Number(start[1])*60+Number(start[2]);return (state.availability?.blockedTimes?.[day]||[]).some(v=>{const m=String(v).match(/^(\d{1,2}):(\d{2})$/);if(!m)return false;const blocked=Number(m[1])*60+Number(m[2]);return mins<blocked+60&&mins+60>blocked})} function validTime(value){return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(value||''))} function isCancelledOn(s,key){return Array.isArray(s.cancelledDates)&&s.cancelledDates.includes(key)} function sessionMatchesCalendar(s,date){if(isFlexible(s))return s.date===date;const move=(s.reschedules||[]).find(r=>r.from===date||r.to===date);if(move)return move.to===date;return s.day===((new Date(date+'T00:00:00').getDay()+6)%7)}     function displayDate(date){if(!date||String(date).startsWith('1899')||String(date).startsWith('1898'))return '';return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric'}).format(new Date(String(date).slice(0,10)+'T00:00:00'))} function dateText(){return new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())} function scheduleLabel(s){return DAYS[s.day]+' · '+s.start} function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`} function isCancelled(s){return Array.isArray(s.cancelledDates)&&s.cancelledDates.includes(todayKey())} function isCompletedOn(s,key){return Array.isArray(s.completedDates)&&s.completedDates.includes(key)} function keyDate(key){return new Date(key+'T00:00:00Z')} function weekStartKey(key=todayKey()){const d=keyDate(key);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)} function recapCounts(){const today=todayKey(),weekStart=weekStartKey(today),month=today.slice(0,7),all=state.sessions.flatMap(s=>(s.completedDates||[]).map(date=>({s,date})));return {daily:all.filter(x=>x.date===today).length,weekly:all.filter(x=>x.date>=weekStart&&x.date<=today).length,monthly:all.filter(x=>x.date.startsWith(month)).length}} function addDaysKey(key,days){const d=keyDate(key);d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)} function expiryDays(c){if(!c.expiryDate)return null;return Math.ceil((keyDate(c.expiryDate)-keyDate(todayKey()))/86400000)} function expiryLabel(c){const days=expiryDays(c);if(days===null)return '';if(days<0)return 'Expired '+Math.abs(days)+' hari';if(days===0)return 'Expired hari ini';return 'Expired '+days+' hari lagi'} function expiringClients(){return state.clients.filter(c=>{const days=expiryDays(c);return days!==null&&days<=10})} function activateNextPackage(c){c.packageQueue=Array.isArray(c.packageQueue)?c.pa     function bindScheduleRows(container){if(!container||container.dataset.bound)return;container.dataset.bound='1';const add=container.parentElement?.querySelector('[data-add-schedule]');add?.addEventListener('click',()=>container.insertAdjacentHTML('beforeend',scheduleRowHTML()));container.addEventListener('click',e=>{const remove=e.target.closest('[data-remove-schedule]');if(remove){const rows=container.querySelectorAll('[data-schedule-row]');if(rows.length>1)remove.closest('[data-schedule-row]').remove();else toast('Minimal satu jadwal harus ada')}})}

    function editToday(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;const root=document.getElementById('dialog-root'),current=effectiveStart(s);root.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><h3>Edit jam hari ini</h3><p>Jadwal rutin ${esc(s.start)} tetap untuk minggu depan. Perubahan ini hanya berlaku ${esc(todayKey())}.</p><form id="today-edit-form"><div class="field"><label>Jam hari ini</label><input name="time" type="time" step="300" value="${esc(current)}" required></div><div class="dialog-actions"><button type="button" class="secondary" data-dialog-cancel>Batal</button><button class="primary" type="submit">Simpan perubahan</button></div></form></div></div>`;root.querySelector('[data-dialog-cancel]').addEventListener('click',closeDialog);root.querySelector('#today-edit-form').addEventListener('submit',e=>{e.preventDefault();const next=e.target.elements.time.value;if(state.sessions.some(x=>x.id!==id&&sessionMatchesDay(x,s.day)&&!isCancelled(x)&&effectiveStart(x)===next)){toast('Jam tersebut sudah terisi pada hari ini');return}s.overrideDate=todayKey();s.overrideStart=next;s.overrideEnd=endTime(next);save();closeDialog();toast('Jam hari ini diperbarui · jadwal rutin tetap');render()})} function addSession(e){e.preventDefault();const fd=new FormData(e.target),type=String(fd.get('scheduleType')||'routine'),date=type==='flexible'?String(fd.get('date')||todayKey()):'',start=String(fd.get('time')),id='s'+Date.now();if(type==='flexible'&&!date){toast('Pilih tanggal booking');return}if(!validTime(start)){toast('Masukkan jam yang valid');return}if(isHoliday(type==='flexible'?date:selectedDate)||isBlockedTime(type==='flexible'?date:selectedDate,start)){toast('Tanggal atau jam tersebut diblokir untuk PT');return}if(state.sessions.some(s=>sessionMatchesCalendar(s,type==='flexible'?date:selectedDate)&&!isCancelledOn(s,type==='flexible'?date:selectedDate)&&s.start===start)){toast('Jam tersebut sudah terisi');return}state.sessions.push({id,client     function addClient(e){e.preventDefault();const fd=new FormData(e.target),total=Math.max(1,Number(fd.get('total'))||8),id='c'+Date.now(),schedules=readScheduleRows(document.getElementById('add-schedule-list'));if(!schedules.length){toast('Tambahkan minimal satu jadwal');return}if(new Set(schedules.map(s=>s.day+'-'+s.start)).size!==schedules.length){toast('Hari dan jam dalam jadwal tidak boleh duplikat');return}if(schedules.some(s=>state.sessions.some(x=>x.day===s.day&&x.start===s.start))){toast('Ada jadwal yang bentrok dengan klien lain');return}state.clients.push({id,name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).trim(),goal:String(fd.get('goal')).trim(),sessionsLeft:total,totalSessions:total,startDate:String(fd.get('startDate')||todayKey()),expiryDate:String(fd.get('expiryDate')||''),topUpHistory:[],packageQueue:[],color:colors[state.clients.length%colors.length]});schedules.forEach((s,i)=>state.sessions.push({id:'s'+Date.now()+i,clientId:id,...s,end:endTime(s.start),completed:false,completedDates:[],cancelledDates:[]}));save();toast('Klien dan jadwal berhasil ditambahkan');renderClients()}

    function showTopUp(id){const c=client(id);if(!c)return;const root=document.getElementById('dialog-root');root.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><h3>Top up paket</h3><p>Saldo sesi ${esc(c.name)} akan ditambah sebagai transaksi top up, bukan mengubah jadwal.</p><form id="topup-form"><div class="field"><label>Jumlah sesi tambahan</label><input name="amount" type="number" min="1" value="8" required></div><div class="field"><label>Tanggal mulai top up</label><input name="startDate" type="date" value="${c.startDate||todayKey()}" required></div><div class="field"><label>Tanggal expired baru</label><input name="expiryDate" type="date" value="${c.expiryDate||''}" required></div><div class="field"><label>Catatan (opsional)</label><input name="note" placeholder="Contoh: Paket Juli"></div><div class="dialog-actions"><button type="button" class="secondary" data-dialog-cancel>Batal</button><button class="primary" type="submit">Simpan top up</button></div></form></div></div>`;root.querySelector('[data-dialog-cancel]').addEventListener('click',closeDialog);root.querySelector('#topup-form').addEventListener('submit',e=>{e.preventDefault();const formData=new FormData(e.target),amount=Math.max(1,Number(formData.get('amount'))||0),startDate=String(formData.get('startDate')||todayKey()),expiryDate=String(formData.get('expiryDate')||''),note=String(formData.get('note')||'').trim();if(!expiryDate||expiryDate<startDate){toast('Tanggal expired harus setelah tanggal mulai');return}c.packageQueue=Array.isArray(c.packageQueue)?c.packageQueue:[];const packageData={date:todayKey(),amount,note,purchaseDate:todayKey(),startDate,expiryDate,status:c.sessionsLeft>0?'queued':'active'};if(c.sessionsLeft>0){c.packageQueue.push(packageData)}else{c.sessionsLeft=amount;c.totalSessions=amount;c.startDate=startDate;c.expiryDate=expiryDate}c.topUpHistory=Array.isArray(c.topUpHistory)?c.topUpHistory:[];c.topUpHistory.push(packageData);save();closeDialog();toast(c.sessionsLeft>0&&p     function showEdit(id){const c=client(id);if(!c)return;const schedules=state.sessions.filter(s=>s.clientId===id),oldSessions=[...schedules],root=document.getElementById('dialog-root');root.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><h3>Edit klien</h3><p>Atur jumlah sesi dan jadwal mingguan klien.</p><form id="edit-client-form"><div class="field"><label>Nama lengkap</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Goal utama</label><input name="goal" required value="${esc(c.goal)}"></div><div class="field"><label>Nomor WhatsApp</label><input name="phone" value="${esc(c.phone||'')}"></div><div class="field"><label>Total sesi paket</label><input name="total" type="number" min="1" value="${c.totalSessions||1}" required></div><div class="field"><label>Tanggal mulai paket</label><input name="startDate" type="date" value="${esc(c.startDate||'')}"></div><div class="field"><label>Tanggal expired paket</label><input name="expiryDate" type="date" value="${esc(c.expiryDate||'')}"></div><div class="field"><label>Jadwal latihan mingguan</label><div class="schedule-list" id="edit-schedule-list">${scheduleRowsHTML(schedules)}</div><button type="button" class="secondary schedule-add" data-add-schedule>＋ Tambah hari dan jam</button></div><div class="dialog-actions"><button type="button" class="secondary" data-dialog-cancel>Batal</button><button class="primary" type="submit">Simpan perubahan</button></div></form></div></div>`;root.querySelector('[data-dialog-cancel]').addEventListener('click',closeDialog);bindScheduleRows(root.querySelector('#edit-schedule-list'));root.querySelector('#edit-client-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),nextSchedules=readScheduleRows(root.querySelector('#edit-schedule-list'));if(!nextSchedules.length){toast('Tambahkan minimal satu jadwal');return}if(new Set(nextSchedules.map(s=>s.day+'-'+s.start)).size!==nextSchedules.length){toast('Hari dan jam     function showDelete(id){const c=client(id);if(!c)return;const root=document.getElementById('dialog-root');root.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><h3>Hapus klien?</h3><p>Data ${esc(c.name)} dan seluruh jadwal rutinnya akan dihapus.</p><div class="dialog-actions"><button class="secondary" data-dialog-cancel>Batal</button><button class="danger" data-dialog-delete>Hapus klien</button></div></div></div>`;root.querySelector('[data-dialog-cancel]').addEventListener('click',closeDialog);root.querySelector('[data-dialog-delete]').addEventListener('click',()=>{state.clients=state.clients.filter(x=>x.id!==id);state.sessions=state.sessions.filter(s=>s.clientId!==id);save();closeDialog();toast('Klien dihapus');renderClients()})}

    function toggleSession(id,checked){const s=state.sessions.find(x=>x.id===id),key=activeTab==='schedule'?selectedDate:todayKey();if(!s||isCancelledOn(s,key))return;const c=client(s.clientId);if(!c)return;s.completedDates=Array.isArray(s.completedDates)?s.completedDates:[];const already=isCompletedOn(s,key);if(already===checked)return;if(checked)s.completedDates.push(key);else s.completedDates=s.completedDates.filter(date=>date!==key);s.completed=checked;c.sessionsLeft=Math.max(0,Math.min(c.totalSessions,c.sessionsLeft+(checked?-1:1)));const switched=checked&&c.sessionsLeft===0&&activateNextPackage(c);save();toast(switched?'Paket lama habis · paket berikutnya otomatis aktif':(checked?'Sesi ditandai selesai':'Checklist sesi dibatalkan'));render()} function toggleCancel(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;s.cancelledDates=Array.isArray(s.cancelledDates)?s.cancelledDates:[];const key=activeTab==='schedule'?selectedDate:todayKey();const index=s.cancelledDates.indexOf(key);if(index>=0){s.cancelledDates.splice(index,1);save();toast('Sesi aktif kembali');render();return}if(isCompletedOn(s,key)){toast('Batalkan checklist selesai dulu sebelum Cancel');return}if(!window.confirm('Cancel sesi ini untuk hari ini? Anda masih bisa memilih Aktifkan kembali setelahnya.'))return;s.cancelledDates.push(key);save();toast('Sesi di-cancel hari ini · pilih Aktifkan kembali bila tidak sengaja');render()}

    function exportData(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pt-slotbook-backup-'+todayKey()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup JSON dibuat')} function exportReportCSV(){const rows=[['Klien','Selesai','Cancel']];state.clients.forEach(c=>{const ss=state.sessions.filter(s=>s.clientId===c.id);rows.push([c.name,ss.flatMap(s=>s.completedDates||[]).length,ss.flatMap(s=>s.cancelledDates||[]).length])});const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pt-slotbook-report-'+todayKey()+'.csv';a.click();toast('Laporan CSV dibuat')} function importData(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.state||!Array.isArray(data.state.clients)||!Array.isArray(data.state.sessions))throw Error();if(!confirm('Restore backup ini? Data lokal saat ini akan diganti.'))return;state=normalizeState(data.state);save();render();toast('Backup berhasil dipulihkan')}catch(e){toast('File backup tidak valid')}};reader.readAsText(file)}
    function showPackageHistory(id){const c=client(id);if(!c)return;const rows=Array.isArray(c.topUpHistory)?c.topUpHistory:[],root=document.getElementById('dialog-root');root.innerHTML=`<div class="dialog-backdrop"><div class="dialog history-dialog"><h3>Paket · ${esc(c.name)}</h3><p>Riwayat pembelian dan antrean paket.</p><div class="history-list">${rows.length?rows.slice().reverse().map((r,i)=>`<div class="history-row"><span>${esc(displayDate(r.purchaseDate||r.date))} · ${esc(r.amount)} sesi<br><small>${esc(r.startDate||'')} → ${esc(r.expiryDate||'')}</small></span><b class="${r.status==='queued'?'history-cancel':'history-done'}">${r.status==='queued'?'Antrean':'Aktif/tercatat'}</b></div>`).join(''):'<div class="empty">Belum ada riwayat paket.</div>'}</div><div class="dialog-actions"><button class="secondary" data-dialog-cancel>Tutup</button></div></div></div>`;root.querySelector('[data-dialog-cancel]').addEventListener('click',closeDialog)}

    function showAvailability(){const a=state.availability||{weeklyHolidays:[6],blockedTimes:{}};const root=document.getElementById('dialog-root');root.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><h3>Atur waktu PT</h3><p>Tentukan hari libur mingguan dan jam yang tidak bisa dibooking.</p><div class="field"><label>Hari libur rutin</label><div class="availability-days">${DAYS.map((d,i)=>`<label><input type="checkbox" name="holiday-day" value="${i}" ${(a.weeklyHolidayNames||DAYS.filter((d,j)=>(a.weeklyHolidays||[]).includes(j))).includes(d)?'checked':''}> ${d}</label>`).join('')}</div></div><div class="field"><label>Jam meeting rutin</label><div class="blocked-grid">${DAYS.map((d,i)=>`<label>${d}<input name="blocked-${i}" type="time" step="300" value="${esc((a.blockedTimes?.[i]||[])[0]||'')}" placeholder="14:30"></label>`).join('')}</div></div><div class="dialog-actions"><button class="secondary" data-dialog-cancel>Batal</button><button class="primary" data-save-availability>Simpan</button></div></div></div>`;root.querySelector('[data-dialog-cancel]').addEventListener('click',closeDialog);root.querySelector('[data-save-availability]').addEventListener('click',()=>{const weeklyHolidays=[...root.querySelectorAll('[name=holiday-day]:checked')].map(x=>Number(x.value));const weeklyHolidayNames=weeklyHolidays.map(i=>DAYS[i]);const blockedTimes={};DAYS.forEach((d,i)=>{blockedTimes[i]=String(root.querySelector(`[name=blocked-${i}]`).value||'').split(',').map(x=>x.trim()).filter(validTime)});state.availability={weeklyHolidays,weeklyHolidayNames,blockedTimes};save();closeDialog();toast('Aturan waktu PT tersimpan');renderSchedule()})}
